name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.22.0
      - run: pnpm install --frozen-lockfile
      - name: Install WASM build tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm check:js
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.97.1 fmt --all -- --check
      - run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.97.1 test --workspace --locked
      - run: python3 -m unittest discover -s scripts -p test_bench.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install WASM build tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 test --workspace --locked
