name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:js
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.97.1 fmt --all -- --check
      - run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.97.1 test --workspace --locked
